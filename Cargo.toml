[package]
name = "tj"
version = "0.1.0"
edition = "2024"

[dependencies]
alacritty_terminal = "0.26"
anyhow = "1.0.105"
gpui-kit = { version = "0.11.0", features = ["tree-sitter-languages"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smol = "2"
toml = "0.9"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
gpui-kit = { version = "0.11.0", features = ["test-support"] }
